{% load ui %}{% if p %}
<div class="panel sp-card{% if p.where == 'islands' %} sp-wide{% endif %}">
  {% if p.image %}<img class="sp-img" src="{{ p.image.url }}" alt="" loading="lazy">{% endif %}
  <div class="sp-body">
    <div class="sp-label">Sponsored{% if p.sponsor.logo %}<img src="{{ p.sponsor.logo.url }}" alt="{{ p.sponsor.name }}" loading="lazy">{% else %}<span>{{ p.sponsor.name }}</span>{% endif %}</div>
    <h3>{{ p.headline }}</h3>
    {% if p.text %}<p class="small muted">{{ p.text }}</p>{% endif %}
    <a class="btn btn-ghost{% if p.where != 'islands' %} btn-block{% endif %}" href="{{ href }}" target="_blank" rel="sponsored noopener">{{ p.button }} {% icon "arrow-up-right" %}</a>
  </div>
</div>
{% endif %}
