{% if rows %}<ol class="an-rank">{% for r in rows %}<li><span class="an-rank-n">{{ forloop.counter }}</span><span class="an-rank-label" title="{{ r.label }}">{{ r.label }}</span><span class="an-rank-bar"><i style="width:{{ r.pct }}%"></i></span><b>{{ r.n }}</b>{% if r.pct is not None %}<small>{{ r.pct }}%</small>{% endif %}</li>{% endfor %}</ol>
{% else %}<div class="an-empty"><span class="material-symbols-outlined">{{ icon|default:"query_stats" }}</span><p>{{ empty|default:"Nothing yet for this period." }}</p></div>{% endif %}
